services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tripfind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flights_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-password}
    ports:
      - "5432:5432"
    volumes:
      - tripfind_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flights_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tripfind-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "PYTHONPATH=/app alembic upgrade head && PYTHONPATH=/app python scripts/seed_countries.py && PYTHONPATH=/app python scripts/seed_airports.py && PYTHONPATH=/app uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend/tripfind
      dockerfile: Dockerfile
    container_name: tripfind-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  tripfind_postgres_data:
